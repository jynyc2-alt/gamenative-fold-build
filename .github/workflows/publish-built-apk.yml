name: Publish built Fold APK

on:
  push:
    paths:
      - '.github/workflows/publish-built-apk.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download successful side-by-side APK artifact
        uses: actions/download-artifact@v4
        with:
          name: gamenative-fold-cover-LT-RT
          path: artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: jynyc2-alt/gamenative-fold-build
          run-id: 33270192798

      - name: Verify and rename downloaded APK
        run: |
          ls -lh artifact
          test -s artifact/gamenative-current-fold-cover-LT-RT.apk
          mv artifact/gamenative-current-fold-cover-LT-RT.apk artifact/gamenative-fold-side-by-side-LT-RT.apk

      - name: Publish side-by-side GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete fold-cover-lt-rt-side-by-side-20260829 --repo "$GITHUB_REPOSITORY" --yes >/dev/null 2>&1 || true
          gh release create fold-cover-lt-rt-side-by-side-20260829 \
            artifact/gamenative-fold-side-by-side-LT-RT.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target main \
            --title "GameNative Fold Side-by-Side LT + RT" \
            --notes "Side-by-side GameNative Fold build using Android application ID app.gamenative.foldtriggers, so it can be installed alongside official app.gamenative. Launcher name is GameNative Fold. Includes Galaxy Fold rear/cover-screen LT/L2 and RT/R2 touch controls; left half is LT/L2, right half is RT/R2, and both can be held simultaneously. Built from GameNative commit b69458827f4c924242bf7706e1b7f3d0760eac68."
