name: Publish built Fold APK

on:
  push:
    paths:
      - '.github/workflows/publish-built-apk.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download fixed side-by-side APK artifact
        uses: actions/download-artifact@v4
        with:
          name: gamenative-fold-cover-LT-RT
          path: artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: jynyc2-alt/gamenative-fold-build
          run-id: 33277326751

      - name: Verify and rename downloaded APK
        run: |
          ls -lh artifact
          test -s artifact/gamenative-current-fold-cover-LT-RT.apk
          mv artifact/gamenative-current-fold-cover-LT-RT.apk artifact/gamenative-fold-side-by-side-inputfix-LT-RT.apk

      - name: Publish fixed side-by-side GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete fold-cover-lt-rt-side-by-side-inputfix-20260829 --repo "$GITHUB_REPOSITORY" --yes >/dev/null 2>&1 || true
          gh release create fold-cover-lt-rt-side-by-side-inputfix-20260829 \
            artifact/gamenative-fold-side-by-side-inputfix-LT-RT.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target main \
            --title "GameNative Fold Side-by-Side LT + RT - Input Fix" \
            --notes "Fixed side-by-side GameNative Fold build using application ID app.gamenative.foldtriggers. This version also patches GameNative's native evshim shared-memory fallback from /data/data/app.gamenative/files to /data/data/app.gamenative.foldtriggers/files, restoring inner-screen virtual controls and rear LT/RT input in the side-by-side package. Launcher name is GameNative Fold. Built from GameNative commit b69458827f4c924242bf7706e1b7f3d0760eac68."
