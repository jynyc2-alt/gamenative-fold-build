name: Publish built Fold APK

on:
  push:
    paths:
      - '.github/workflows/publish-built-apk.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download host-evshim-fixed side-by-side APK artifact
        uses: actions/download-artifact@v4
        with:
          name: gamenative-fold-cover-LT-RT
          path: artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: jynyc2-alt/gamenative-fold-build
          run-id: 33281717239

      - name: Verify and rename downloaded APK
        run: |
          ls -lh artifact
          test -s artifact/gamenative-current-fold-cover-LT-RT.apk
          mv artifact/gamenative-current-fold-cover-LT-RT.apk artifact/gamenative-fold-side-by-side-host-evshim-fix-LT-RT.apk

      - name: Publish host evshim fix GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete fold-cover-lt-rt-side-by-side-host-evshim-fix-20260829 --repo "$GITHUB_REPOSITORY" --yes >/dev/null 2>&1 || true
          gh release create fold-cover-lt-rt-side-by-side-host-evshim-fix-20260829 \
            artifact/gamenative-fold-side-by-side-host-evshim-fix-LT-RT.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target main \
            --title "GameNative Fold Side-by-Side LT + RT - Host EVSHIM Fix" \
            --notes "Side-by-side GameNative Fold build using application ID app.gamenative.foldtriggers. Includes the upstream GameNative PR #1818 host-process controller fix: PluviaApp sets EVSHIM_BASE_PATH to filesDir before preloadSystemLibraries(), so libevshim's C constructor maps gamepad shared memory in the renamed app rather than falling back to /data/data/app.gamenative/files. Also retains the package-aware guest paths and Fold cover-screen LT/RT controls. Built from GameNative commit b69458827f4c924242bf7706e1b7f3d0760eac68."
