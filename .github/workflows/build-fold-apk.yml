name: Build GameNative Fold LT-RT APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-fold-apk.yml'
      - 'build-support/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out build harness
        uses: actions/checkout@v4
        with:
          path: harness

      - name: Check out current GameNative baseline
        uses: actions/checkout@v4
        with:
          repository: utkarshdalal/GameNative
          ref: b69458827f4c924242bf7706e1b7f3d0760eac68
          path: GameNative

      - name: Apply Fold cover-screen trigger patch
        run: python3 harness/build-support/apply_patch.py GameNative

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Inject non-production build credentials
        working-directory: GameNative
        run: |
          cat <<'EOF' > local.properties
          POSTHOG_API_KEY=dummy
          POSTHOG_HOST=https://us.i.posthog.com
          STEAMGRIDDB_API_KEY=dummy
          CLOUD_PROJECT_NUMBER=dummy
          EOF

      - name: Ensure Android SDK components
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;34.0.0" "ndk;27.3.13750724"

      - name: Build standard GameNative bundle
        working-directory: GameNative
        run: ./gradlew :app:bundleLegacyRelease --stacktrace

      - name: Create local APK signing key
        run: |
          keytool -genkeypair -v \
            -keystore fold-debug.keystore \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=GameNative Fold Build,O=Local,C=US"

      - name: Convert bundle to universal installable APK
        shell: bash
        run: |
          java -jar GameNative/tools/bundletool-all-1.17.2.jar build-apks \
            --bundle=GameNative/app/build/outputs/bundle/legacyRelease/app-legacy-release.aab \
            --output=gamenative-fold.apks \
            --mode=universal \
            --ks=fold-debug.keystore \
            --ks-pass=pass:android \
            --ks-key-alias=androiddebugkey \
            --key-pass=pass:android
          unzip -p gamenative-fold.apks universal.apk > gamenative-current-fold-cover-LT-RT.apk
          test -s gamenative-current-fold-cover-LT-RT.apk

      - name: Verify APK signature
        shell: bash
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          if [ ! -x "$APKSIGNER" ]; then
            APKSIGNER="$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner"
          fi
          "$APKSIGNER" verify --verbose gamenative-current-fold-cover-LT-RT.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gamenative-fold-cover-LT-RT
          path: gamenative-current-fold-cover-LT-RT.apk
          if-no-files-found: error
          retention-days: 7
